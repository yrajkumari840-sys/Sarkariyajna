<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>सरकारी योजना - भारत</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #ff7a00, #e53935);
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 16px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0001;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      background: #ff6f00;
      color: white;
      font-size: 15px;
    }

    button:hover {
      background: #e65100;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .category {
      background: white;
      border: 1px solid #ddd;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    .category:hover {
      background: #ff6f00;
      color: white;
    }

    .schemes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0001;
    }

    .card h3 {
      color: #e65100;
      margin-bottom: 10px;
    }

    .card p {
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .ai-box {
      margin-top: 30px;
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0001;
    }

    #answer {
      margin-top: 15px;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    footer {
      margin-top: 40px;
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
    }

    @media(max-width:600px) {
      header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🇮🇳 भारत सरकार की योजनाएँ</h1>
  <p>सरकारी योजनाओं की जानकारी एक ही जगह</p>
</header>

<div class="container">

  <div class="search-box">
    <h2>योजना खोजें</h2>
    <br>
    <input
      id="searchInput"
      type="text"
      placeholder="जैसे - किसान, छात्र, महिला, रोजगार..."
    >
    <button onclick="searchSchemes()">खोजें</button>
  </div>

  <h2>श्रेणी चुनें</h2>
  <br>

  <div class="categories">
    <div class="category" onclick="filterSchemes('सभी')">सभी</div>
    <div class="category" onclick="filterSchemes('किसान')">🌾 किसान</div>
    <div class="category" onclick="filterSchemes('महिला')">👩 महिला</div>
    <div class="category" onclick="filterSchemes('शिक्षा')">🎓 शिक्षा</div>
    <div class="category" onclick="filterSchemes('रोजगार')">💼 रोजगार</div>
    <div class="category" onclick="filterSchemes('स्वास्थ्य')">🏥 स्वास्थ्य</div>
    <div class="category" onclick="filterSchemes('आवास')">🏠 आवास</div>
  </div>

  <div id="schemeList" class="schemes"></div>

  <div class="ai-box">
    <h2>🤖 AI योजना सहायक</h2>
    <p>किसी योजना के बारे में सवाल पूछें:</p>
    <br>

    <input
      id="aiQuestion"
      type="text"
      placeholder="उदाहरण: किसानों के लिए कौन सी योजना है?"
    >

    <button onclick="askAI()">AI से पूछें</button>

    <div id="answer">यहाँ AI का उत्तर दिखाई देगा...</div>
  </div>

</div>

<footer>
  © 2026 सरकारी योजना जानकारी | भारत
</footer>

<script>

const schemes = [

  {
    name: "प्रधानमंत्री किसान सम्मान निधि",
    category: "किसान",
    description: "पात्र किसानों को आर्थिक सहायता प्रदान करने वाली केंद्र सरकार की योजना।"
  },

  {
    name: "प्रधानमंत्री उज्ज्वला योजना",
    category: "महिला",
    description: "पात्र परिवारों को LPG कनेक्शन उपलब्ध कराने की योजना।"
  },

  {
    name: "प्रधानमंत्री आवास योजना",
    category: "आवास",
    description: "पात्र परिवारों को पक्का घर उपलब्ध कराने के उद्देश्य से योजना।"
  },

  {
    name: "आयुष्मान भारत",
    category: "स्वास्थ्य",
    description: "पात्र लाभार्थियों को स्वास्थ्य उपचार की सुविधा प्रदान करने वाली योजना।"
  },

  {
    name: "प्रधानमंत्री कौशल विकास योजना",
    category: "रोजगार",
    description: "युवाओं को कौशल प्रशिक्षण देने के उद्देश्य से योजना।"
  },

  {
    name: "छात्रवृत्ति योजनाएँ",
    category: "शिक्षा",
    description: "योग्य विद्यार्थियों के लिए विभिन्न छात्रवृत्ति और शिक्षा सहायता योजनाएँ।"
  }

];


// सभी योजनाएँ दिखाएँ
function displaySchemes(data) {

  const list = document.getElementById("schemeList");

  list.innerHTML = "";

  if (data.length === 0) {
    list.innerHTML = "<p>कोई योजना नहीं मिली।</p>";
    return;
  }

  data.forEach(scheme => {

    list.innerHTML += `
      <div class="card">
        <h3>${scheme.name}</h3>
        <p><b>श्रेणी:</b> ${scheme.category}</p>
        <p>${scheme.description}</p>
      </div>
    `;

  });
}


// Category filter
function filterSchemes(category) {

  if (category === "सभी") {
    displaySchemes(schemes);
    return;
  }

  const result = schemes.filter(
    scheme => scheme.category === category
  );

  displaySchemes(result);
}


// Search
function searchSchemes() {

  const query =
    document.getElementById("searchInput").value.toLowerCase();

  const result = schemes.filter(scheme =>
    scheme.name.toLowerCase().includes(query) ||
    scheme.category.toLowerCase().includes(query) ||
    scheme.description.toLowerCase().includes(query)
  );

  displaySchemes(result);
}


// Gemini AI
async function askAI() {

  const question =
    document.getElementById("aiQuestion").value;

  const answer =
    document.getElementById("answer");

  if (!question) {
    answer.innerText = "कृपया अपना सवाल लिखें।";
    return;
  }

  answer.innerText = "AI जानकारी तैयार कर रहा है...";

  // अपनी Gemini API Key यहाँ डालें
  const API_KEY = "YOUR_GEMINI_API_KEY";

  const prompt = `
आप भारत सरकार की योजनाओं के सहायक हैं।

यूजर का सवाल:
${question}

हिंदी भाषा में सरल उत्तर दें।

उत्तर में जहाँ संभव हो:
1. योजना का नाम
2. किसके लिए है
3. मुख्य लाभ
4. पात्रता
5. आवेदन कैसे करें

गलत या अपुष्ट जानकारी न दें।
आधिकारिक जानकारी के लिए
india.gov.in और myscheme.gov.in देखने की सलाह दें।
`;

  try {

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": API_KEY
        },

        body: JSON.stringify({
          contents: [
            {
              parts: [
                {
                  text: prompt
                }
              ]
            }
          ]
        })
      }
    );

    const data = await response.json();

    if (data.error) {
      answer.innerText =
        "API Error: " + data.error.message;
      return;
    }

    answer.innerText =
      data.candidates?.[0]?.content?.parts?.[0]?.text ||
      "कोई उत्तर नहीं मिला।";

  } catch (error) {

    answer.innerText =
      "कनेक्शन में समस्या हुई। कृपया दोबारा प्रयास करें।";

    console.error(error);
  }
}


// शुरुआत में सभी योजनाएँ
displaySchemes(schemes);

</script>

</body>
</html>
